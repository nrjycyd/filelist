# Keep the docs site and the dev setup on the newest VitePress. Each update is
# a pull request, so CI (build, unit tests, e2e, compat) runs before it lands;
# merging it redeploys the docs site with the new version.
version: 2
updates:
  # Docs site (demo/): VitePress, vitepress-tuck, Vue and the tuck plugins,
  # checked daily. `vitepress-plugin-filelist` is left out on purpose: the demo
  # takes it from this repository (`file:..`), so it has no version to compare,
  # and Dependabot fails the whole job when it tries to update it.
  - package-ecosystem: npm
    directory: /demo
    schedule:
      interval: daily
    allow:
      - dependency-name: vitepress
      - dependency-name: vitepress-tuck
      - dependency-name: vue
      - dependency-name: vitepress-plugin-field
      - dependency-name: vitepress-plugin-npm-to
      - dependency-name: vitepress-plugin-steps
    groups:
      vitepress:
        patterns:
          - vitepress
          - vitepress-tuck
          - vue
          - vitepress-plugin-field
          - vitepress-plugin-npm-to
          - vitepress-plugin-steps
    commit-message:
      prefix: "chore(demo)"
    labels: [dependencies]

  # Plugin dev dependencies used by typecheck and tests, checked weekly.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-name: vitepress
      - dependency-name: vitepress-tuck
      - dependency-name: vue
    groups:
      vitepress:
        patterns: [vitepress, vitepress-tuck, vue]
    commit-message:
      prefix: "chore(deps-dev)"
    labels: [dependencies]

  # GitHub Actions used by the workflows, checked monthly.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: "ci"
    labels: [dependencies]
