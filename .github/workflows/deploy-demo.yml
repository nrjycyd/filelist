name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Build demo site
        working-directory: demo
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Check Pages availability
        id: pages
        uses: actions/github-script@v9
        with:
          script: |
            try {
              await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo,
              })
              core.setOutput('enabled', 'true')
            } catch (error) {
              core.setOutput('enabled', 'false')
              core.notice('GitHub Pages is not enabled for this repository; deploy skipped. Enable it in Settings -> Pages -> Source: GitHub Actions.')
            }
      - uses: actions/configure-pages@v6
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: demo/docs/.vitepress/dist

  deploy:
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for Pages artifact
        uses: actions/github-script@v9
        with:
          script: |
            for (let attempt = 1; attempt <= 6; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                name: 'github-pages',
              })
              if (data.artifacts.length > 0) return
              core.info(`Artifact "github-pages" not visible yet (attempt ${attempt}/6); retrying in 3s...`)
              await new Promise(resolve => setTimeout(resolve, 3000))
            }
      - id: deployment
        uses: actions/deploy-pages@v5
