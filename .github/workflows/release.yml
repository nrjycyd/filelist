name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Use npm with trusted publishing support
        run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm test
      # The tag must match package.json; a pre-release (1.0.0-rc.1) goes to the
      # `next` dist-tag so `npm install` keeps getting the latest stable release.
      # npm refuses to publish a pre-release without --tag.
      - name: Check the tag and pick the npm dist-tag
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          # vuepress-plugin-filelist is released with the same version.
          vuepress=$(node -p "require('./packages/vuepress-plugin-filelist/package.json').version")
          if [ "$vuepress" != "$version" ]; then
            echo "::error::packages/vuepress-plugin-filelist is $vuepress, expected $version"
            exit 1
          fi
          if [[ "$version" == *-* ]]; then echo "tag=next" >> "$GITHUB_OUTPUT"; else echo "tag=latest" >> "$GITHUB_OUTPUT"; fi
      # Each package is skipped when its version is already on npm, so a run
      # that failed halfway can simply be re-run.
      - name: Publish to npm (OIDC)
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "vitepress-plugin-filelist@$version" version >/dev/null 2>&1; then
            echo "vitepress-plugin-filelist@$version is already published, skipped."
            exit 0
          fi
          npm publish --provenance --access public --tag ${{ steps.version.outputs.tag }}
      # Published the same way as the main package, from its own folder, after
      # `workspace:*` becomes the exact version.
      - name: Publish vuepress-plugin-filelist (OIDC)
        working-directory: packages/vuepress-plugin-filelist
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "vuepress-plugin-filelist@$version" version >/dev/null 2>&1; then
            echo "vuepress-plugin-filelist@$version is already published, skipped."
            exit 0
          fi
          node -e "const fs = require('node:fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); pkg.dependencies['vitepress-plugin-filelist'] = pkg.version; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\\n')"
          grep -q '"vitepress-plugin-filelist": "'"$version"'"' package.json
          npm publish --provenance --access public --tag ${{ steps.version.outputs.tag }}
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.tag == 'next' }}
