name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same PR or branch cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Docs-only changes skip the browser jobs (a skipped job still satisfies a
  # required check).
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'packages/**'
              - 'pnpm-workspace.yaml'
              - 'e2e/**'
              - 'demo/e2e/**'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'demo/package.json'
              - 'demo/pnpm-lock.yaml'
              - '*.config.*'
              - 'tsconfig.json'
              - '.github/workflows/**'

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm test
      - name: Build demo site
        working-directory: demo
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

  # Sites on the oldest Node that package.json "engines" promises. The dev
  # tools need Node 22, so build with it, then run the compat sites on 20.19.
  node20:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # pnpm 11 itself needs Node 22, so everything that runs pnpm happens
      # before the switch; the sites below only use npm, which ships with Node 20.
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19
      - run: node --version && node scripts/compat.mjs
        env:
          COMPAT_SKIP_BUILD: '1'

  # Plain VitePress 1.6 and 2.x sites with the packed plugin (scripts/compat.mjs).
  compat:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:compat

  # VuePress 2 sites (default theme, plume, hope) with both packages packed
  # (packages/vuepress-plugin-filelist/scripts/compat.mjs).
  vuepress:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:compat:vuepress

  # Browser tests: the fixture site in demo/e2e against a mock OpenList.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chromium
            browser: chromium
            projects: --project=chromium --project=mobile
          - name: webkit
            browser: webkit
            projects: --project=webkit
    name: e2e (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Build the fixture site
        working-directory: demo
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:e2e
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm exec playwright test ${{ matrix.projects }}
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.name }}
          path: |
            playwright-report
            test-results
          retention-days: 7
